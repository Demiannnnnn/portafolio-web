services:
  proxy:
    build: ./proxy
    ports:
      -"80:80"
    networks:
      - backend-network
      - frontend-network
  frontend:
    build: ./frontend
    ports:
      -":${frontend_port}"
    networks:
      - frontend-network

  backend:
    build: ./backend
    ports:
      -":${backend_port}"
    networks:
      - backend-network
    depends_on:
      - database
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER_FILES: /run/secrets/db_user
      - POSTGRES_PASSWORD_FILES: /run/secrets/db_password
      - POSTGRES_DB: /run/secrets/db_name

    ports:
      -":${db_port}"
    volumes:
      -postgres_data:/var/lib/postgres/data
      -./db-init:/docker-entrypoint-initdb.d
    secrets:
      - db_user
      - db_password
      - db_name
    networks:
      - backend-network


secrets:
  db_user:
    file: ${db_user}
  db_password:
    file: ${db_password}
  db_name:
    file: ${db_name}

volumes:
  postgres_data:
  
networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
