services:
  proxy:
    build: ./proxy
    ports:
      - "${proxy_port}:80"
    environment:
      - proxy_port=${proxy_port}
      - backend_port=${backend_port}
      - frontend_port=${frontend_port}
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - backend
      - frontend
  frontend:
    build: ./frontend
    ports:
      - "${frontend_port}:5173"
    networks:
      - frontend-network

  backend:
    build: ./backend
    ports:
      - "${backend_port}:8000"
    networks:
      - backend-network
    depends_on:
      - database
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: /run/secrets/db_name

    ports:
      - "${db_port}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    secrets:
      - db_user
      - db_password
      - db_name
    networks:
      - backend-network

secrets:
  db_user:
    file: ${db_user}
  db_password:
    file: ${db_password}
  db_name:
    file: ${db_name}

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
