services:
  proxy:
    build: ./proxy
    ports:
      -"80:80"
    networks:
      - backend-network
      - frontend-network
  frontend:
    build: ./frontend
    ports:
      -":5173"
    networks:
      - frontend-network

  backend:
    build: ./backend
    ports:
      -":3000"
    networks:
      - backend-network
    depends_on:
      - database
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER_FILES: ${}
      - POSTGRES_PASSWORD_FILES: 
  

