apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f compose.yaml -o k8s/
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f compose.yaml -o k8s/
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: DATABASE_HOST
              value: database
            - name: DATABASE_NAME_FILE
              value: /run/secrets/db-name
            - name: DATABASE_PASSWORD_FILE
              value: /run/secrets/db-password
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER_FILE
              value: /run/secrets/db-user
          image: portfolio-backend:latest
          imagePullPolicy: Never
          name: backend
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /run/secrets/db-user
              name: db-user
              subPath: db-user
            - mountPath: /run/secrets/db-password
              name: db-password
              subPath: db-password
            - mountPath: /run/secrets/db-name
              name: db-name
              subPath: db-name
      restartPolicy: Always
      volumes:
        - name: db-user
          secret:
            items:
              - key: db-user
                path: db-user
            secretName: db-user
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: db-name
          secret:
            items:
              - key: db-name
                path: db-name
            secretName: db-name
